[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gfst-hmb-mpuc"
version = "0.1.0"
description = "MPUC-first GFST-HMB runtime with sparse-support centroid recall and a Qwen3 1.7B teacher"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "accelerate>=1.6.0",
  "datasets>=3.5.0",
  "huggingface-hub>=0.30.0",
  "numpy>=2.0.0",
  "protobuf>=5.28.0",
  "PyYAML>=6.0.2",
  "rich>=13.9.0",
  "safetensors>=0.5.3",
  "sentencepiece>=0.2.0",
  "textual>=0.82.0",
  "tiktoken>=0.9.0",
  "transformers>=4.53.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
